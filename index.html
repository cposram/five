<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>岡聯五子棋 - 最強NPC</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --coffee: #6f4e37; --wood: #e3c16f; --grass: #87CEEB; --gold: #FFD700; --red: #ff4444; --dark-overlay: rgba(0,0,0,0.85); }
        /* 加入 transition 讓變色過程有動畫感 */
        body { margin: 0; background: var(--grass); font-family: "Microsoft JhengHei", sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; touch-action: none; transition: filter 1.5s ease; }
        
        /* 🔥 極度悲慘模式：高對比灰階濾鏡 */
        body.miserable-mode {
            filter: grayscale(95%) contrast(150%) brightness(80%);
        }

        /* 🏆 排行榜區塊 */
        #leaderboard-zone { position: absolute; top: 5px; left: 5px; right: 5px; display: flex; flex-direction: column; gap: 4px; z-index: 110; }
        .row-one { display: flex; gap: 4px; }
        .row-two { width: 100%; }
        .rank-box { background: rgba(0,0,0,0.85); color: white; border-radius: 8px; padding: 4px; border: 1px solid var(--gold); box-shadow: 0 2px 8px rgba(0,0,0,0.4); text-align: center; flex: 1; }
        .rank-box b { font-size: 10px; display: block; margin-bottom: 2px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 2px; }
        .rank-list-flex { display: flex; justify-content: space-around; gap: 2px; min-height: 25px; }
        .master-grid-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; min-height: 48px; }
        .rank-unit { flex: 1; display: flex; flex-direction: column; align-items: center; font-size: 9px; line-height: 1.1; border-right: 0.5px solid rgba(255,255,255,0.1); }
        .rank-unit:last-child { border-right: none; }
        .rank-unit .name { color: #ccc; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rank-unit .steps { color: var(--gold); font-weight: bold; font-size: 11px; }
        .master-grid-box { border-color: var(--red) !important; }
        .master-grid-box b { color: var(--red); }

        /* 選單與遊戲容器 */
        #setup-menu { margin-top: 170px; text-align: center; background: white; padding: 25px; border-radius: 20px; width: 85%; max-width: 300px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); z-index: 100; }
        #game-container { position: relative; margin-top: 160px; z-index: 10; display: none; text-align: center; }
        canvas#victoryCanvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 100; }
        #board { display: grid; grid-template-columns: repeat(15, 22px); grid-template-rows: repeat(15, 22px); background: var(--wood); border: 4px solid #8b4513; border-radius: 6px; cursor: pointer; margin: 0 auto; }
        @media (min-width: 600px) { #board { grid-template-columns: repeat(15, 38px); grid-template-rows: repeat(15, 38px); } }
        .cell { border: 0.5px solid rgba(139, 69, 19, 0.4); display: flex; justify-content: center; align-items: center; }
        .piece { width: 92%; height: 92%; border-radius: 50%; animation: drop 0.2s ease-out; }
        .black { background: radial-gradient(circle at 35% 35%, #444, #000); }
        .white { background: radial-gradient(circle at 35% 35%, #fff, #bbb); }
        .btn { background: var(--coffee); color: white; border: none; padding: 12px; margin: 8px; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 18px; box-shadow: 0 4px 0 #4e3626; width: 100%; }
        .stats { font-size: 13px; color: white; text-shadow: 1px 1px 3px #000; margin-bottom: 5px; font-weight: bold; }
        @keyframes drop { from { transform: scale(3); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* 🆕 新增：自定義結算模態視窗 */
        #result-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: none; justify-content: center; align-items: center;
            z-index: 200; background: rgba(0,0,0,0.6);
            opacity: 0; transition: opacity 0.5s ease;
        }
        #result-modal.show { display: flex; opacity: 1; }
        .result-content {
            background: white; padding: 30px; border-radius: 16px; text-align: center;
            width: 80%; max-width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: scale(0.8); transition: transform 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }
        #result-modal.show .result-content { transform: scale(1); }
        .result-content h2 { margin: 0 0 10px 0; font-size: 28px; }
        .result-content p { font-size: 16px; color: #555; margin-bottom: 25px; }

        /* 勝利主題 */
        .win-theme .result-content { border: 4px solid var(--gold); }
        .win-theme h2 { color: #d4af37; }
        
        /* 失敗主題 (悲慘) */
        .lose-theme { background: rgba(0,0,0,0.9) !important; }
        .lose-theme .result-content { background: #2a2a2a; border: 4px solid #555; color: #ccc; }
        .lose-theme h2 { color: var(--red); }
        .lose-theme p { color: #999; }
        .lose-theme .btn { background: #444; box-shadow: 0 4px 0 #222; }
    </style>
</head>
<body>

<script>
// =========================================================================
// ⚙️ [AI 智力與核心參數]
// =========================================================================
const CONFIG = {
    defenseMultipliers: { easy: 1.2, medium: 2.2, hard: 3.8 },
    weights: {
        five: 1000000, liveFour: 100000, jumpFour: 80000, deadFour: 10000,
        liveThree: 8000, jumpThree: 5000, deadThree: 1500, liveTwo: 400,
        centerBonus: 1.8, comboBonus: 4.5
    },
    firebase: {
        apiKey: "AIzaSyBQr_3o913vgaWUg4PAuequLEVE1mZFS7M",
        databaseURL: "https://cowgame-48dd8-default-rtdb.firebaseio.com",
        projectId: "cowgame-48dd8"
    }
};
firebase.initializeApp(CONFIG.firebase);
const db = firebase.database();
const paths = { easy: 'rank_v4_easy', medium: 'rank_v4_medium', hard: 'rank_v4_hard' };
const topScores = { easy: [], medium: [], hard: [] };
</script>

<div id="leaderboard-zone">
    <div class="row-one">
        <div class="rank-box"><b>初級 Top 3</b><div id="rank-easy" class="rank-list-flex">載入中...</div></div>
        <div class="rank-box"><b>中級 Top 3</b><div id="rank-medium" class="rank-list-flex">載入中...</div></div>
    </div>
    <div class="row-two">
        <div class="rank-box master-grid-box"><b>🔥 巔峰殿堂 Top 6 (最強 AI)</b><div id="rank-hard" class="master-grid-list">載入中...</div></div>
    </div>
</div>

<div id="setup-menu">
    <h1 style="color:var(--coffee); margin:0; font-size: 24px;">岡聯五子棋</h1>
    <p style="font-size:12px; color:#666; margin-bottom:10px;">難度已全面進化遞補</p>
    <button class="btn" onclick="startGomoku('easy')">初級 (基礎 AI)</button>
    <button class="btn" onclick="startGomoku('medium')">中級 (進階型樣)</button>
    <button class="btn" onclick="startGomoku('hard')" style="background:var(--red); box-shadow:0 4px 0 #8e2020">🔥 巔峰大師 (極致防禦)</button>
</div>

<div id="game-container">
    <div class="stats"><span id="display-lv"></span> | 步數: <span id="step-count">0</span></div>
    <div id="board"></div>
    <canvas id="victoryCanvas"></canvas>
    <button class="btn" onclick="location.reload()" style="background:#666; box-shadow:0 4px 0 #444; margin-top:10px; width:100px; font-size:12px; padding:8px;">放棄回選單</button>
</div>

<div id="result-modal">
    <div class="result-content">
        <h2 id="result-title"></h2>
        <p id="result-msg"></p>
        <button class="btn" onclick="location.reload()">再挑戰一局</button>
    </div>
</div>

<script>
// --- [1] 監聽排行榜 ---
function listenRank(lv) {
    const limit = (lv === 'hard') ? 6 : 3;
    db.ref(paths[lv]).orderByChild('steps').limitToFirst(limit).on('value', snap => {
        const listEl = document.getElementById(`rank-${lv}`);
        topScores[lv] = [];
        let html = "";
        if (snap.exists()) {
            snap.forEach(c => {
                const d = c.val(); topScores[lv].push(d);
                html += `<div class="rank-unit"><span class="name">${d.name}</span><span class="steps">${d.steps}步</span></div>`;
            });
            listEl.innerHTML = html;
        } else { listEl.innerHTML = "<span style='color:#777; font-size:9px;'>等待紀錄</span>"; }
    });
}
['easy', 'medium', 'hard'].forEach(listenRank);

// --- [2] 遊戲核心 ---
let board = [], steps = 0, isGameOver = false, difficulty = 'easy', frameCount = 0;
const canvas = document.getElementById('victoryCanvas'), ctx = canvas.getContext('2d');
const diffLabels = { easy: '初級', medium: '中級', hard: '巔峰大師' };

function startGomoku(lv) {
    difficulty = lv;
    document.getElementById('setup-menu').style.display = 'none';
    document.getElementById('game-container').style.display = 'block';
    document.getElementById('display-lv').innerText = diffLabels[lv];
    initBoard();
    requestAnimationFrame(animationLoop);
}

function initBoard() {
    const el = document.getElementById('board'); el.innerHTML = '';
    board = Array(15).fill().map(() => Array(15).fill(0));
    for (let r = 0; r < 15; r++) {
        for (let c = 0; c < 15; c++) {
            const div = document.createElement('div');
            div.className = 'cell'; div.onclick = () => playerMove(r, c);
            el.appendChild(div);
        }
    }
    canvas.width = el.offsetWidth; canvas.height = el.offsetHeight;
}

function playerMove(r, c) {
    if (board[r][c] !== 0 || isGameOver) return;
    placePiece(r, c, 1); steps++;
    document.getElementById('step-count').innerText = steps;
    if (checkWin(r, c, 1)) { endGame(true); return; }
    setTimeout(npcMove, 450);
}

function npcMove() {
    if (isGameOver) return;
    let best = findBestMove();
    placePiece(best.r, best.c, 2);
    if (checkWin(best.r, best.c, 2)) endGame(false);
}

function placePiece(r, c, p) {
    board[r][c] = p;
    const div = document.createElement('div');
    div.className = `piece ${p === 1 ? 'black' : 'white'}`;
    document.getElementsByClassName('cell')[r * 15 + c].appendChild(div);
}

// --- [3] AI 引擎 (維持不變) ---
function findBestMove() {
    let best = {r: 7, c: 7, s: -Infinity};
    let candidates = [];
    if (difficulty === 'hard' && board[7][7] === 0) return {r: 7, c: 7};
    for(let r=0; r<15; r++) {
        for(let c=0; c<15; c++) {
            if (board[r][c] === 0) {
                let s = evalPos(r, c);
                if (s > best.s) { best = {r, c, s}; candidates = [{r, c}]; }
                else if (s === best.s) { candidates.push({r, c}); }
            }
        }
    }
    return candidates[Math.floor(Math.random() * candidates.length)];
}

function evalPos(r, c) {
    let pScore = getAdvancedScore(r, c, 1); 
    let nScore = getAdvancedScore(r, c, 2); 
    let centerScore = (7 - Math.abs(r - 7)) + (7 - Math.abs(c - 7));
    if (difficulty === 'hard') {
        if (nScore >= CONFIG.weights.five) return nScore * 10;
        if (pScore >= CONFIG.weights.five) return pScore * 8;
        return (pScore * CONFIG.defenseMultipliers.hard) + nScore + (centerScore * CONFIG.weights.centerBonus);
    } else if (difficulty === 'medium') {
        return (pScore * CONFIG.defenseMultipliers.medium) + nScore + centerScore;
    }
    return (pScore * CONFIG.defenseMultipliers.easy) + nScore;
}

function getAdvancedScore(r, c, p) {
    let totalScore = 0; let threats = 0; let killerMove = false;
    const dirs = [[1,0],[0,1],[1,1],[1,-1]]; const W = CONFIG.weights;
    for (let [dr, dc] of dirs) {
        let lineStr = ""; 
        for (let i = -4; i <= 4; i++) {
            if (i === 0) { lineStr += "P"; continue; }
            let rr = r + dr * i, cc = c + dc * i;
            let val = board[rr]?.[cc];
            if (val === undefined) lineStr += "X";
            else if (val === 0) lineStr += "0";
            else if (val === p) lineStr += "1";
            else lineStr += "X";
        }
        let s = 0;
        if (/1111P|111P1|11P11|1P111|P1111/.test(lineStr)) s = W.five;
        else if (/0111P0|011P10|01P110|0P1110/.test(lineStr)) s = W.liveFour;
        else if (/X111P0|0P111X|X11P10|01P11X/.test(lineStr)) s = W.deadFour;
        else if (/111P0|11P10|1P110|0P111|01P11|011P1/.test(lineStr)) s = W.jumpFour;
        else if (/011P0|01P10|0P110/.test(lineStr)) s = W.liveThree;
        else if (/01P010|010P10/.test(lineStr)) s = W.jumpThree;
        else if (/01P0|0P10/.test(lineStr)) s = W.liveTwo;
        if (s > 0) { totalScore += s; if (s >= W.liveThree) threats++; if (s >= W.liveFour) killerMove = true; }
    }
    if (difficulty === 'hard' && (threats >= 2 || (threats >= 1 && killerMove))) totalScore *= CONFIG.weights.comboBonus;
    return totalScore;
}

function checkWin(r, c, p) {
    const dirs = [[1,0],[0,1],[1,1],[1,-1]];
    for (let [dr, dc] of dirs) {
        let cnt = 1;
        for (let i=1; i<5; i++) if (board[r+dr*i]?.[c+dc*i] === p) cnt++; else break;
        for (let i=1; i<5; i++) if (board[r-dr*i]?.[c-dc*i] === p) cnt++; else break;
        if (cnt >= 5) return true;
    }
    return false;
}

// --- [4] 🆕 全新結算處理 (視覺優化) ---
function endGame(win) {
    isGameOver = true;
    const modal = document.getElementById('result-modal');
    const title = document.getElementById('result-title');
    const msg = document.getElementById('result-msg');

    // 移除舊的主題 class
    modal.classList.remove('win-theme', 'lose-theme');

    if (win) {
        // 🎉 玩家勝利：金色輝煌主題
        modal.classList.add('win-theme');
        title.innerHTML = "🏆 恭喜獲勝！";
        msg.innerHTML = `在 [${diffLabels[difficulty]}] 難度下，你僅用了 <b>${steps}</b> 步就擊敗了 AI。`;
        
        // 檢查破紀錄 (維持原有邏輯)
        const limit = (difficulty === 'hard') ? 6 : 3;
        const myList = topScores[difficulty];
        const isTop = myList.length < limit || steps < myList[myList.length - 1].steps;
        if (isTop) {
            setTimeout(() => {
                const name = prompt(`🎉 新紀錄！請輸入你的大名以登錄排行榜：`) || "神祕高手";
                db.ref(paths[difficulty]).push({ name, steps, time: Date.now() });
            }, 800);
        }
    } else {
        // 💀 NPC 勝利：極度悲慘模式
        // 對 body 添加悲慘濾鏡 class
        document.body.classList.add('miserable-mode');
        
        modal.classList.add('lose-theme');
        title.innerHTML = "💀 你輸了...";
        msg.innerHTML = `勝敗乃兵家常事，但這次你被 AI 無情地碾壓了。<br>要再來一局雪恥嗎？`;
    }
    
    // 顯示模態視窗 (延遲一點點讓濾鏡先跑)
    setTimeout(() => {
        modal.classList.add('show');
    }, 100);
}

// --- [5] 動畫迴圈 (維持不變，但會受濾鏡影響) ---
function animationLoop() {
    frameCount++;
    if (isGameOver) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for(let i=0; i<30; i++) { // 增加一點泡泡數量
            // 這裡不需要改顏色，因為 body 的 grayscale 濾鏡會自動把金色變成死灰色
            ctx.fillStyle = i%2===0 ? 'gold' : 'rgba(255,255,255,0.8)';
            ctx.beginPath();
            // 讓泡泡飄慢一點，增加沉重感
            let speed = isGameOver && document.body.classList.contains('miserable-mode') ? 0.5 : 2;
            let x = (frameCount*speed + i*80)%canvas.width;
            let y = canvas.height - (frameCount*(speed*0.8) + i*70)%canvas.height; 
            // 隨機大小
            let radius = (Math.sin(i)*5 + 5); 
            ctx.arc(x, y, radius, 0, Math.PI*2); ctx.fill();
        }
    }
    requestAnimationFrame(animationLoop);
}
</script>
</body>
</html>
